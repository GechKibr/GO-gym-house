{% extends 'sport/admin_base.html' %}
{% block admin_content %}
    <div class="admin-form-container">
        <h2 class="mb-4">{{ title }}</h2>
        <form method="post">
            {% csrf_token %}
            <div class="admin-form-section">
                <h5>📝 Article Content</h5>
                {{ form.as_p }}
            </div>

            <div class="admin-form-actions">
                <button type="submit" class="btn btn-success px-4 py-2 fw-bold shadow-sm">Save Post</button>
                <a href="{% url 'admin_blog_list' %}" class="btn btn-outline-secondary px-4 py-2">Cancel</a>
            </div>
        </form>
    </div>
{% endblock %}
