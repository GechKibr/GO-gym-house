{% extends 'sport/base.html' %}

{% block content %}

<style>
    body {
        background: linear-gradient(135deg, #1e3c72, #2a5298);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .login-container {
        max-width: 420px;
        margin: 80px auto;
        padding: 40px;
        background: #ffffff;
        border-radius: 20px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        animation: fadeIn 0.6s ease-in-out;
    }

    .login-title {
        text-align: center;
        margin-bottom: 30px;
        font-weight: 600;
        color: #1e3c72;
    }

    form p {
        margin-bottom: 18px;
    }

    form input {
        width: 100%;
        padding: 12px;
        border-radius: 10px;
        border: 1px solid #ddd;
        transition: 0.3s;
        font-size: 14px;
    }

    form input:focus {
        border-color: #2a5298;
        outline: none;
        box-shadow: 0 0 8px rgba(42,82,152,0.3);
    }

    .btn-login {
        width: 100%;
        padding: 13px;
        background: linear-gradient(45deg, #007bff, #0056b3);
        color: white;
        border: none;
        border-radius: 10px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s ease;
        margin-top: 10px;
    }

    .btn-login:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(0,123,255,0.4);
    }

    .divider {
        margin: 30px 0;
        text-align: center;
        position: relative;
    }

    .divider::before,
    .divider::after {
        content: "";
        position: absolute;
        width: 40%;
        height: 1px;
        background: #ddd;
        top: 50%;
    }

    .divider::before { left: 0; }
    .divider::after { right: 0; }

    .divider span {
        background: #fff;
        padding: 0 10px;
        color: #888;
        font-size: 14px;
    }

    .register-section {
        text-align: center;
    }

    .btn-register {
        display: inline-block;
        padding: 10px 25px;
        background: #28a745;
        color: white;
        text-decoration: none;
        border-radius: 10px;
        font-weight: 600;
        transition: 0.3s ease;
    }

    .btn-register:hover {
        background: #218838;
        transform: translateY(-2px);
        box-shadow: 0 6px 15px rgba(40,167,69,0.4);
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>

<div class="login-container">

    <h2 class="login-title">
        Welcome Back 👋 
    </h2>

    <form method="POST">
        {% csrf_token %}
        
        {{ form.as_p }}

        <button type="submit" class="btn-login">
            Login
        </button>
    </form>

    <div class="divider">
        <span>OR</span>
    </div>

    <div class="register-section">
        <p style="margin-bottom:12px;color:#555;">
            Don’t have an account?
        </p>

        <a href="{% url 'register' %}" class="btn-register">
            Create Account
        </a>
    </div>

</div>

{% endblock %}
